name: CI Pipeline - E2E Tests

run-name: >
  CI Pipeline - ${
    { github.event_name == 'push' && 'Execução por Push' ||
       github.event_name == 'workflow_dispatch' && 'Execução Manual' ||
       github.event_name == 'schedule' && 'Execução Agendada' ||
       github.event_name }
  }

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Identificar tipo de execução
        run: |
          echo "Tipo de evento: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Execução iniciada por PUSH na branch main"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Execução iniciada MANUALMENTE pelo usuário"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Execução iniciada por AGENDAMENTO (schedule)"
          fi

      - name: Registrar resumo da execução
        run: |
          echo "## Resumo da execução" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: CI Pipeline - E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Evento: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "- Tipo: Execução por Push" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- Tipo: Execução Manual" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "- Tipo: Execução Agendada" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Executar testes E2E e gerar relatório
        run: npm run test:e2e

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: reports/
          if-no-files-found: warn