name: CI Pipeline - E2E Tests

on:
  # Execução por push
  push:
    branches:
      - main

  # Execução manual
  workflow_dispatch:

  # Execução agendada
  schedule:
    - cron: '0 * * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Identificar tipo de execução
        run: |
          echo "## Resumo da execução" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: CI Pipeline - E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Evento: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "- Tipo: Execução por Push" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- Tipo: Execução Manual" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "- Tipo: Execução Agendada" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Tipo: Outro evento" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm run test:e2e

      - name: Gerar relatório de testes
        if: always()
        run: |
          mkdir -p reports
          echo "Relatório da execução do workflow" > reports/relatorio-testes.txt
          echo "Workflow: CI Pipeline - E2E Tests" >> reports/relatorio-testes.txt
          echo "Evento: ${{ github.event_name }}" >> reports/relatorio-testes.txt
          echo "Branch: ${{ github.ref_name }}" >> reports/relatorio-testes.txt
          echo "Commit: ${{ github.sha }}" >> reports/relatorio-testes.txt
          echo "Repositório: ${{ github.repository }}" >> reports/relatorio-testes.txt
          echo "Data: $(date)" >> reports/relatorio-testes.txt

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: reports/
          if-no-files-found: warn

      - name: Registrar status final
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status final" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow concluída em: $(date)" >> $GITHUB_STEP_SUMMARY